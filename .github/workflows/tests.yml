name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  simulated:
    name: Simulated CLI (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            runner: ubuntu-24.04
          - python-version: "3.15"
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run simulated CLI tests
        run: python -B -m unittest discover -s tests -v
